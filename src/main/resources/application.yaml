#  keycloack:
#    tokenUri: ${KEYCLOAK_TOKEN_URI}
#    url: ${KEYCLOAK_URL}
#    clientId: ${KEYCLOAK_CLIENT_ID}
#    clientSecret: ${KEYCLOAK_CLIENT_SECRET}
#    redirectUri: ${KEYCLOAK_REDIRECT_URI}

auth:
  keycloack:
    loginUrl: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/${KEYCLOAK_PROTOCOL}/auth
    logoutUrl: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/${KEYCLOAK_PROTOCOL}/logout
    loginRedirectUrl: ${KEYCLOAK_REDIRECT_LOGIN_URI}
    logoutRedirectUrl: ${KEYCLOAK_REDIRECT_LOGOUT_URI}
    clientId: ${KEYCLOAK_CLIENT_ID}
    tokenUrl: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/${KEYCLOAK_PROTOCOL}/token
    clientSecret: ${KEYCLOAK_CLIENT_SECRET}

mail:
  default:
    timezone: ${DEFAULT_MAIL_TIMEZONE:CET}
    language: ${DEFAULT_MAIL_LANGUAGE:pl}

frontend:
  login: ${FRONTEND_LOGIN}
  callback: ${FRONTEND_CALLBACK}

maintenance-interval:
  min-ahead: ${MAINTENANCE_INTERVAL_MIN_AHEAD}

window:
  length: ${RESERVATION_WINDOW_LENGTH:15}

resource:
  warning:
    mail: ${RESOURCE_WARNING_MAILS_ENABLED:true}

jws:
  secret: ${JWS_SECRET}

executor:
  task-time-tolerance: ${EXECUTOR_TASK_TIME_TOLERANCE:3}
  vm:
    grace-time: ${EXECUTOR_VM_SHUTDOWN_GRACE_TIME:2}
  mail:
    urls:
      reservations: ${FRONTEND_RESERVATIONS_VIEW:http://localhost:5173/reservations}
