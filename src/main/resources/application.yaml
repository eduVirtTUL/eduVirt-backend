spring:
  cache:
    cache-names: vms,qos
  host: ${HOST}
  application:
    name: eduVirt
  jpa:
    open-in-view: false
  profiles:
    active: @spring.profiles.active@
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    sender: ${MAIL_SENDER}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      "mail.smtp.auth": ${MAIL_PROPERTIES_ENABLE_AUTH:true}
      "mail.smtp.starttls.enable": ${MAIL_PROPERTIES_STARTTLS:true}
      "mail.smtp.ssl.enable": ${MAIL_PROPERTIES_SSL_ENABLE:true}
      "mail.smtp.ssl.trust": ${MAIL_PROPERTIES_SSL_TRUST:${HOST}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}
  datasource:
    url: ${EDUVIRT_DB_URL}
    username: ${EDUVIRT_DB_USERNAME}
    password: ${EDUVIRT_DB_PASSWORD}
    driver-class-name: ${EDUVIRT_DB_DRIVER_CLASS:org.postgresql.Driver}
  liquibase:
    default-schema: public
    user: ${LIQUIBASE_USER}
    password: ${LIQUIBASE_PASSWORD}
    change-log: classpath:/config/liquibase/master.xml

ovirt:
  engine:
    url: ${ENGINE_URL}
    username: ${ENGINE_USERNAME}
    password: ${ENGINE_PASSWORD}
    jks:
      file: ${JKS_FILE:ovirte-tst-keystore.jks}
      password: ${JKS_PASSWORD:password}

